<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hotel Food Service</title>
    <style>

    </style>
</head>
<body>
    <h1>Hotel Food Service</h1>
    <form action="#" method="post">
        <fieldset>
            <legend>Personal Information</legend>
        <p>
            <label for="name">Name</label><br>
            <input type="text" id="name" name="name" placeholder="Write Your Name" required>
        </p> 
        <p>
            <label for="email">Email</label> <br>
            <input type="email" id="email" name="email" placeholder="Write Your Email Address" required>
        </p> 
        <p>
            <label for="contactnumber">Contact Number</label> <br>
            <input type="tel" id="contactnumber" name="contactnumber" pattern="03[0-9]{2}-?[0-9]{7}" placeholder="0300-1234567" required>
        </p>
        <p>
        <label for="city">City Name</label> 
        <select name="city" id="city" required>
            <option value="" disabled selected>Select Your City</option>
            <option value="Layyah">Layyah</option>
            <option value="Dera Ghazi Khan">Dera Ghazi Khan</option>
            <option value="Multan">Multan</option>
            <option value="Karachi">Karachi</option>
            <option value="Islamabad">Islamabad</option>
            <option value="Rawalpindi">Rawalpindi</option>
            <option value="Faisalabad">Faisalabad</option>
        </select>
        </p>
        <p>
            <label for="address">Address</label> 
            <textarea name="address" id="address" cols="30" rows="10" placeholder="Write Your Address" required></textarea>
        </p> 
        </fieldset>
        <fieldset>
           <legend>Time&Date</legend>
        <p>
        <label for="date">Date</label> <br>
        <input type="date" name="date" id="date" required>
        </p>
        <p>
            <label for="time">Time</label> <br>
            <input type="time" id="time" name="time" required>
        </p>
        </fieldset>
        <fieldset>
            <legend>What type of service is required?</legend>
        <p>
            <input type="checkbox" name="service" id="dine-in" value="dine-in">
            <label for="dine-in">Dine-in</label>
        </p>
        <p>
            <input type="checkbox" name="service" id="delivery" value="delivery">
            <label for="delivery">Home Delivery</label>
        </p>
        </fieldset>
        <button type="submit">Submit</button>
        <button type="reset">Reset</button>
    </form>
</body>
</html>
